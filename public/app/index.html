<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نظام سعد — Life OS</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="نظامي">
<meta name="theme-color" content="#0b0b0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◎</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
/* ===== الخطوط ===== */
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Thmanyah Sans";src:url("/fonts/thmanyah/thmanyahsans-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Thmanyah Serif";src:url("/fonts/thmanyah/thmanyahserifdisplay-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Thmanyah Serif";src:url("/fonts/thmanyah/thmanyahserifdisplay-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

/* ===== الرموز ===== */
:root{
  --accent:#5b6cf5;
  --bg:#fbfbfc; --surface:#ffffff; --surface2:#f4f4f6; --surface3:#ebebef;
  --ink:#16161a; --ink2:#4b4b55; --muted:#8a8a96;
  --line:#e6e6ec; --line2:#d9d9e2;
  --good:#1f9d63; --bad:#dc4a3d; --warn:#d8952e;
  --r:14px; --r-sm:10px; --r-lg:20px;
  --shadow:0 1px 2px rgba(16,16,26,.05), 0 8px 24px -12px rgba(16,16,26,.14);
  --shadow-lg:0 24px 60px -20px rgba(16,16,26,.28);
  --gap:18px;
}
:root[data-theme="dark"]{
  --bg:#0b0b0d; --surface:#141417; --surface2:#1b1b20; --surface3:#25252c;
  --ink:#f4f4f6; --ink2:#c2c2cc; --muted:#82828e;
  --line:#232329; --line2:#2f2f38;
  --good:#3ecf8e; --bad:#f0685c; --warn:#e5a94a;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -24px rgba(0,0,0,.8);
}
:root[data-density="compact"]{--gap:12px}

*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:"Thmanyah Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background-size:cover;background-position:center;background-attachment:fixed;
}
body.has-wp .shell{background:transparent}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.serif{font-family:"Thmanyah Serif","Thmanyah Sans",serif}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hidden{display:none !important}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.sm{font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== عناصر أساسية ===== */
input,select,textarea{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-sm);
  padding:10px 12px;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical;min-height:88px;line-height:1.7}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{width:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r-sm);padding:9px 16px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);border:1px solid var(--line2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--muted)}
.btn.soft{background:var(--surface2);color:var(--ink2)}
.btn.soft:hover{background:var(--surface3);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.xs{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;color:var(--muted);transition:.14s;flex:none}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2)}
.chip svg{width:12px;height:12px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== الدخول ===== */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-box{width:100%;max-width:380px;text-align:center}
.login-box .mark{font-size:44px;line-height:1;margin-bottom:14px;color:var(--accent)}
.login-box h1{font-size:26px;margin-bottom:4px}
.login-box p.sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.login-box .field{text-align:right;margin-bottom:12px}
.login-box .btn{width:100%;margin-top:6px;padding:12px}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
.msg{color:var(--muted);font-size:13px;margin-top:10px;min-height:18px}

/* ===== الهيكل ===== */
.shell{display:grid;grid-template-columns:var(--sb,248px) 1fr;min-height:100vh;transition:grid-template-columns .24s cubic-bezier(.4,0,.2,1)}
.shell.collapsed{grid-template-columns:0 1fr}
.shell.collapsed .sidebar{opacity:0;pointer-events:none;overflow:hidden;padding-inline:0}

.sidebar{
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-inline-start:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;
  transition:opacity .2s;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand .glyph{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.brand b{font-size:15px;display:block;line-height:1.2}
.brand span{font-size:11.5px;color:var(--muted)}
.navsec{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:14px 10px 6px}
.nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -2px;padding:0 2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink2);font-weight:500;font-size:14px;cursor:pointer;transition:.12s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.active{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-weight:600}
.nav a svg{width:16px;height:16px;flex:none}
.nav a .cnt{margin-inline-start:auto;font-size:11px;color:var(--muted);font-weight:600}
.nav a.active .cnt{color:var(--accent)}
.navfoot{border-top:1px solid var(--line);padding-top:8px;margin-top:8px;display:flex;flex-direction:column;gap:1px}

.content{display:flex;flex-direction:column;min-width:0}
.topbar{
  height:56px;display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--line);
}
.topbar h2{font-size:16px;font-weight:600}
.topbar .date{font-size:13px;color:var(--muted)}
#syncDot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:.3s}
#syncDot[data-state=ok]{background:var(--good)}
#syncDot[data-state=busy]{background:var(--warn)}
#syncDot[data-state=bad]{background:var(--bad)}
.view{padding:26px 22px 80px;max-width:1240px;width:100%;margin:0 auto;flex:1}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;inset-inline-start:0;top:0;width:270px;z-index:60;transform:translateX(100%);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none;opacity:1;pointer-events:auto}
  .shell.collapsed{grid-template-columns:1fr}
  .view{padding:18px 14px 90px}
  .topbar{padding:0 14px}
}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;backdrop-filter:blur(2px)}

/* ===== رأس الصفحة ===== */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-head h1{font-size:27px}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* ===== لوحة الجوانب ===== */
.areas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:var(--gap)}
.area-card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;cursor:pointer;transition:transform .16s cubic-bezier(.4,0,.2,1),box-shadow .16s,border-color .16s;
  box-shadow:var(--shadow);overflow:hidden;text-align:start;display:block;width:100%;
}
.area-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--line2)}
.area-card .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:11px}
.area-card .ic svg{width:18px;height:18px}
.area-card h3{font-size:15px;margin-bottom:3px}
.area-card .meta{font-size:12.5px;color:var(--muted);line-height:1.55;min-height:38px}
.area-card .bar{height:4px;border-radius:3px;background:var(--surface3);margin-top:12px;overflow:hidden}
.area-card .bar i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.area-card .pct{position:absolute;top:14px;inset-inline-end:14px;font-size:12px;font-weight:700;color:var(--muted)}

/* ===== الويدجتس ===== */
.widgets{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);margin-bottom:26px}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px 16px;grid-column:span 4;min-width:0;position:relative}
.widget.sm{grid-column:span 3}
.widget.md{grid-column:span 4}
.widget.lg{grid-column:span 6}
.widget.xl{grid-column:span 12}
@media(max-width:1100px){.widget.sm{grid-column:span 4}.widget.md{grid-column:span 6}}
@media(max-width:760px){.widget,.widget.sm,.widget.md,.widget.lg{grid-column:span 12}}
.widget .wh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:11px;letter-spacing:.02em}
.widget .wh svg{width:14px;height:14px}
.widget .wh .act{margin-inline-start:auto;display:flex;gap:2px}
.widget .big{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.widget.drag-over{border-color:var(--accent);border-style:dashed}
.widget[draggable=true]{cursor:grab}

/* ===== قوائم عامة ===== */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:none}
.item .t{flex:1;min-width:0}
.item .t b{font-weight:500;display:block}
.item.done .t b{text-decoration:line-through;color:var(--muted)}
.item .acts{display:flex;gap:2px;opacity:0;transition:.15s}
.item:hover .acts{opacity:1}
.cbox{width:18px;height:18px;border-radius:6px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;cursor:pointer;transition:.14s;background:var(--surface)}
.cbox:hover{border-color:var(--accent)}
.cbox.on{background:var(--accent);border-color:var(--accent)}
.cbox.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-1px)}
.empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:13.5px}
.empty svg{width:26px;height:26px;opacity:.45;margin-bottom:8px}

/* أولوية */
.pri{width:3px;height:16px;border-radius:2px;flex:none}
.pri.high{background:var(--bad)}.pri.mid{background:var(--warn)}.pri.low{background:var(--muted);opacity:.5}

/* ===== صفحة الجانب ===== */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--gap);align-items:start}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec > .sh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec > .sh h3{font-size:14.5px;flex:1}
.sec > .sh svg{width:15px;height:15px;color:var(--muted)}
.sparkline{display:flex;align-items:flex-end;gap:3px;height:44px;margin:10px 0 4px}
.sparkline i{flex:1;border-radius:3px 3px 0 0;background:color-mix(in srgb,var(--accent) 35%,transparent);min-height:3px}
.sparkline i:last-child{background:var(--accent)}
.rec{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px;font-size:13.5px;background:var(--surface2)}
.rec b{display:block;font-weight:600;font-size:14px}
.rec .kv{color:var(--muted);font-size:12.5px;margin-top:2px}

/* ===== Time Boxing ===== */
.tb-wrap{display:grid;grid-template-columns:300px 1fr;gap:var(--gap);align-items:start}
@media(max-width:980px){.tb-wrap{grid-template-columns:1fr}}
.tb-side{display:flex;flex-direction:column;gap:var(--gap);position:sticky;top:76px}
@media(max-width:980px){.tb-side{position:static}}
.tb-grid{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.slot{display:grid;grid-template-columns:66px 1fr;border-bottom:1px solid var(--line);min-height:38px}
.slot:last-child{border-bottom:none}
.slot .hr{padding:6px 10px;font-size:11.5px;color:var(--muted);border-inline-end:1px solid var(--line);display:flex;align-items:flex-start;font-variant-numeric:tabular-nums;background:var(--surface2)}
.slot.half .hr{color:transparent}
.slot .cell{padding:3px 6px;min-height:38px;position:relative;transition:background .12s}
.slot .cell.over{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.slot.now{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.slot.now .hr{color:var(--accent);font-weight:700}
.blk{display:flex;align-items:center;gap:8px;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:500;cursor:grab;border-inline-start:3px solid;margin:1px 0}
.blk.done{opacity:.55}
.blk.done .bt{text-decoration:line-through}
.blk .bt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .x{opacity:0;font-size:11px}
.blk:hover .x{opacity:.7}
.pool{display:flex;flex-direction:column;gap:5px;max-height:340px;overflow-y:auto}
.pool .pi{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;cursor:grab;background:var(--surface2)}
.pool .pi:hover{border-color:var(--accent)}
.pool .pi.dragging{opacity:.4}
.pri-slot{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
.pri-slot:last-child{border-bottom:none}
.pri-slot .n{width:22px;height:22px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.pri-slot input{border:none;background:none;padding:2px 0;font-size:14px;box-shadow:none !important}
.pri-slot.done input{text-decoration:line-through;color:var(--muted)}

/* ===== نافذة ===== */
.modal-back{position:fixed;inset:0;background:rgba(10,10,14,.42);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:200;padding:18px;animation:fade .16s}
@keyframes fade{from{opacity:0}}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-height:88vh;display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.4,0,.2,1)}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.modal-head h3{flex:1;font-size:16px}
.modal-body{padding:18px;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field > em{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;font-style:normal}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}

/* ===== توست ===== */
#toast{position:fixed;bottom:24px;inset-inline-start:50%;transform:translateX(50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:13.5px;font-weight:600;z-index:300;opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow-lg);white-space:nowrap}
#toast.show{opacity:1;transform:translateX(50%) translateY(0)}
#toast.bad{background:var(--bad);color:#fff}
#toast.good{background:var(--good);color:#fff}

/* ===== شريط الالتقاط السريع ===== */
.fab{position:fixed;bottom:22px;inset-inline-end:22px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -8px color-mix(in srgb,var(--accent) 70%,transparent);z-index:90;transition:.16s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:22px;height:22px}
.palette{position:fixed;inset:0;background:rgba(10,10,14,.4);backdrop-filter:blur(6px);z-index:210;display:flex;align-items:flex-start;justify-content:center;padding-top:14vh}
.palette .box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden}
.palette input{border:none;border-radius:0;padding:16px 18px;font-size:16px;box-shadow:none !important}
.palette .res{max-height:52vh;overflow-y:auto;border-top:1px solid var(--line)}
.palette .res a{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:14px;cursor:pointer}
.palette .res a:hover,.palette .res a.sel{background:var(--surface2)}
.palette .res a svg{width:15px;height:15px;color:var(--muted)}
.palette .res a .k{margin-inline-start:auto;font-size:11px;color:var(--muted)}
</style>
</head>
<body>

<!-- ============ الدخول ============ -->
<div id="loginView" class="login-wrap hidden">
  <div class="login-box">
    <div class="mark">◎</div>
    <h1 class="serif">نظام سعد</h1>
    <p class="sub">مركز إدارة الحياة — Life OS</p>
    <label class="field"><span>البريد الإلكتروني</span><input id="em" type="email" autocomplete="username" placeholder="you@example.com"></label>
    <label class="field"><span>كلمة المرور</span><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn primary" id="btnLogin" onclick="doLogin()">دخول</button>
    <button class="btn ghost" id="btnSignup" onclick="doSignup()" style="margin-top:8px">إنشاء حساب جديد</button>
    <div class="err" id="loginErr"></div>
    <div class="msg" id="loginMsg"></div>
    <p class="tiny muted" style="margin-top:20px">بياناتك محفوظة في قاعدة بياناتك الخاصة، ولا يصل إليها غيرك.</p>
  </div>
</div>
